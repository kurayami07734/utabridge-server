spring:
  datasource:
    url: jdbc:postgresql://${DB_HOST:0.0.0.0}:${DB_PORT:5432}/${DB_NAME:utabridge_db}
    username: ${DB_USERNAME:postgres}
    password: ${DB_PASSWORD}
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enabled: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  validity-duration-ms: 3600000

gcp:
  client-id: ${GCP_CLIENT_ID}
  credentials-json: ${GCP_CREDENTIALS_JSON}
  project-id: ${GCP_PROJECT_ID}

resilience4j:
  ratelimiter:
    instances:
      default:
        limitForPeriod: 60
        limitRefreshPeriod: 1m
        timeoutDuration: 500ms

springdoc:
  swagger-ui:
    enabled: false
  api-docs:
    enabled: false
