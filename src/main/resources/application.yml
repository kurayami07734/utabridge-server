spring:
  application:
    name: utabridge-server
  datasource:
    url: jdbc:postgresql://0.0.0.0:5432/utabridge_db
    username: postgres
    password: password
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: true
    properties:
      hibernate:
        dialect: org.hibernate.dialect.PostgreSQLDialect
  flyway:
    enable: true
    baseline-on-migrate: true

jwt:
  secret: ${JWT_SECRET}
  validity-duration-ms: 3600000

gcp:
  client-id: ${GCP_CLIENT_ID}
  credentials-json: ${GCP_CREDENTIALS_JSON}
  project-id: ${GCP_PROJECT_ID}

resilience4j:
  ratelimiter:
    instances:
      default:
        limitForPeriod: 60
        limitRefreshPeriod: 1m
        timeoutDuration: 500ms

springdoc:
  swagger-ui:
    path: /api/docs.html
